version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chronos-backend
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - chronos-net
    # Expose port within the network (no host port mapping)
    expose:
      - "5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chronos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chronos-net

networks:
  chronos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16